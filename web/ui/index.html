<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/gpuardian-icon.svg" />
    <link rel="apple-touch-icon" href="/gpuardian-icon.svg" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("gpuardian-theme");
          const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch {
          document.documentElement.classList.toggle("dark", matchMedia("(prefers-color-scheme: dark)").matches);
        }
      })();
    </script>
    <title>GPUardian</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
