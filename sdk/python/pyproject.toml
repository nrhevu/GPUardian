[project]
name = "gpuardian-sdk"
version = "0.1.0"
description = "Token-authenticated Python SDK for GPUardian"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gpuardian_sdk"]
